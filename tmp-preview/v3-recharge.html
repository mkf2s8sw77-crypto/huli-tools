<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>充值 v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
:root {
  --color-bg: #F5F0E8; --color-surface: #FBF8F2; --color-bg-card: #ffffff;
  --color-border-soft: #EDE5D3;
  --color-primary: #8A6A3A; --color-on-primary: #ffffff;
  --color-accent-warm: #C8804A; --color-accent-warm-light: #F4E2D2;
  --color-success: #6F8F5A; --color-success-light: #E5ECDC;
  --color-warning: #B8904A; --color-warning-light: #F0E5C8;
  --color-text: #2D2418; --color-text-secondary: #5A4A38; --color-text-muted: #8A7A66;
  --radius-md: 10px; --radius-lg: 16px; --radius-xl: 24px; --radius-pill: 999px;
  --gradient-warm: linear-gradient(135deg, #C8804A 0%, #D69A6A 100%);
  --gradient-primary: linear-gradient(135deg, #8A6A3A 0%, #B8956A 100%);
  --page-bg: linear-gradient(180deg, #EFE6D2 0%, #F5F0E8 160px, #F8F4EB 100%);
  --font-serif: "Noto Serif SC", "Songti SC", Georgia, serif;
  --font-sans: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
  --shadow-card: 0 1px 1px rgba(255,255,255,0.5) inset, 0 2px 12px rgba(125,98,50,0.08);
  --shadow-elevated: 0 1px 1px rgba(255,255,255,0.6) inset, 0 8px 24px rgba(125,98,50,0.1);
  --shadow-soft: 0 1px 2px rgba(45,36,24,0.04), 0 2px 8px rgba(45,36,24,0.04);
}
html, body { margin: 0; }
body { font-family: var(--font-sans); background: #555; color: var(--color-text); -webkit-font-smoothing: antialiased; }
.page-frame { width: 390px; height: 844px; overflow: hidden; background: var(--page-bg); position: relative; margin: 24px auto; box-shadow: 0 12px 60px rgba(0,0,0,0.3); }
.status-bar { position: absolute; top: 0; left: 0; right: 0; height: 44px; background: #F5F0E8; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 15px; font-weight: 600; color: #2D2418; z-index: 10; }
.status-bar__time { font-variant-numeric: tabular-nums; }
.status-bar__icons { display: flex; gap: 6px; align-items: center; }
.status-bar__icons::after { content: ''; display: inline-block; width: 24px; height: 12px; background: #2D2418; border-radius: 3px; }
.nav-bar { position: absolute; top: 44px; left: 0; right: 0; height: 44px; background: #F5F0E8; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; color: #2D2418; z-index: 10; border-bottom: 0.5px solid rgba(0,0,0,0.05); }
.scroll-content { position: absolute; top: 88px; left: 0; right: 0; bottom: 0; overflow-y: auto; padding: 16px; padding-bottom: 32px; }
.serif-num { font-family: var(--font-serif); font-variant-numeric: tabular-nums; font-weight: 600; }
.phase-switcher { position: fixed; top: 12px; left: 12px; z-index: 100; background: rgba(0,0,0,0.7); border-radius: 6px; padding: 4px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 360px; }
.phase-switcher button { background: transparent; border: none; color: #fff; padding: 6px 10px; font-size: 11px; border-radius: 4px; cursor: pointer; font-weight: 500; }
.phase-switcher button.active { background: #8A6A3A; }
</style>
</head>
<body>

<div class="phase-switcher">
  <button onclick="location.href='v3-p0-config.html'">P0</button>
  <button onclick="location.href='v3-index.html'">首页</button>
  <button onclick="location.href='v3-profile.html'">我的</button>
  <button onclick="location.href='v3-orders.html'">订单</button>
  <button class="active" onclick="location.href='v3-recharge.html'">充值</button>
  <button onclick="location.href='v3-undercover-game.html'">卧底中</button>
  <button onclick="location.href='v3-undercover-result.html'">卧底结果</button>
</div>

<div class="page-frame">
  <div class="status-bar"><span class="status-bar__time">9:41</span><span class="status-bar__icons"></span></div>
  <div class="nav-bar">积分充值</div>

  <div class="scroll-content">
    <p style="font-size: 12px; color: var(--color-text-muted); margin: 0 0 16px; padding-left: 16px;">选择充值包为账户增加积分</p>

    <!-- 充值引导 hero -->
    <div style="position: relative; overflow: hidden; border-radius: 24px; padding: 16px; margin-bottom: 16px; background: var(--gradient-warm); box-shadow: var(--shadow-elevated); color: #fff;">
      <div style="position: absolute; top: -25px; right: -15px; width: 100px; height: 100px; border-radius: 50%; background: rgba(255,255,255,0.10);"></div>
      <div style="display: flex; flex-direction: column; gap: 3px; position: relative; z-index: 1;">
        <span class="serif-num" style="font-size: 17px; font-weight: 600; color: #fff; line-height: 1.25;">为账户补充积分</span>
        <span style="font-size: 12px; color: #fff; opacity: 0.86;">选择下方任一充值包创建订单</span>
        <span style="font-size: 12px; color: #fff; opacity: 0.86; margin-top: 4px;">2 个套餐可选 · 实时到账</span>
      </div>
    </div>

    <!-- 套餐 1 -->
    <div style="background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-card); border: 0.5px solid var(--color-border-soft);">
      <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0;">
        <span class="serif-num" style="font-size: 16px; font-weight: 600; color: var(--color-text);">基础包 30 元</span>
        <span class="serif-num" style="font-size: 19px; font-weight: 600; color: var(--color-accent-warm);">¥30.00</span>
      </div>
      <div style="height: 1px; background: var(--color-border-soft); margin: 6px 0;"></div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
        <span style="font-size: 13px; color: var(--color-text-secondary);">基础积分</span>
        <span class="serif-num" style="font-size: 13px; color: var(--color-text);">3000</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--color-border-soft);">
        <span style="font-size: 13px; color: var(--color-text-secondary);">到账总计</span>
        <span class="serif-num" style="font-size: 15px; color: var(--color-primary); font-weight: 600;">3000 积分</span>
      </div>
      <button style="width: 100%; margin-top: 12px; padding: 10px; background: var(--gradient-primary); color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow-soft); font-family: var(--font-sans);">创建订单</button>
    </div>

    <!-- 套餐 2 -->
    <div style="background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-card); border: 0.5px solid var(--color-border-soft);">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <span class="serif-num" style="font-size: 16px; font-weight: 600; color: var(--color-text);">加量包 50 元</span>
        <span class="serif-num" style="font-size: 19px; font-weight: 600; color: var(--color-accent-warm);">¥50.00</span>
      </div>
      <div style="height: 1px; background: var(--color-border-soft); margin: 6px 0;"></div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
        <span style="font-size: 13px; color: var(--color-text-secondary);">基础积分</span>
        <span class="serif-num" style="font-size: 13px; color: var(--color-text);">5000</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
        <span style="font-size: 13px; color: var(--color-text-secondary);">赠送积分</span>
        <span class="serif-num" style="font-size: 13px; color: var(--color-success); font-weight: 600;">+500</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--color-border-soft);">
        <span style="font-size: 13px; color: var(--color-text-secondary);">到账总计</span>
        <span class="serif-num" style="font-size: 15px; color: var(--color-primary); font-weight: 600;">5500 积分</span>
      </div>
      <button style="width: 100%; margin-top: 12px; padding: 10px; background: var(--gradient-primary); color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow-soft); font-family: var(--font-sans);">创建订单</button>
    </div>

    <div style="background: #fff; border-radius: 16px; padding: 12px 16px; box-shadow: var(--shadow-card); border: 0.5px solid var(--color-border-soft); display: flex; justify-content: space-between; align-items: center;">
      <span style="font-size: 14px; color: var(--color-primary); font-weight: 500;">查看我的订单</span>
      <span style="font-size: 14px; color: var(--color-text-muted);">›</span>
    </div>
  </div>
</div>

</body>
</html>
