<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0">
<title>卧底 - P0 配置阶段</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="phase-switcher">
  <button class="active" onclick="document.body.dataset.phase='config';location.href='p0-config.html'">P0 配置</button>
  <button onclick="location.href='p1-game.html'">P1 游戏</button>
  <button onclick="location.href='p2-vote.html'">P2 投票</button>
  <button onclick="location.href='p3-result.html'">P3 结果</button>
</div>

<div class="page-frame" id="frame">
  <div class="status-bar">
    <span class="status-bar__time">9:41</span>
    <span class="status-bar__icons"></span>
  </div>
  <div class="nav-bar">huli-tools</div>

  <div class="scroll-content">
    <!-- P0 应用头部 hero -->
    <div class="app-exec-header app-exec-header--undercover">
      <div class="app-exec-header__row">
        <div class="icon-tile icon-tile--app icon-tile--lavender icon-tile--undercover">
          <div class="icon-tile__glyph"></div>
        </div>
        <div class="app-exec-header__info">
          <span class="app-exec-header__name">谁是卧底（护理版）</span>
          <span class="app-exec-header__cost">免费</span>
          <span class="app-exec-header__desc">与 AI 护士一起,揪出那个跟标准答案不一样的"卧底"</span>
        </div>
      </div>
    </div>

    <!-- 模式选择 -->
    <div class="nu-section-eyebrow">第一步 · 选个玩法</div>
    <div class="nu-mode-grid">
      <div class="nu-mode-card nu-mode-card--active">
        <div class="nu-mode-card__icon icon-tile icon-tile--app icon-tile--lavender"><div class="icon-tile__glyph"></div></div>
        <div class="nu-mode-card__body">
          <span class="nu-mode-card__label">病例推理卧底</span>
          <span class="nu-mode-card__desc">在真实护理场景中讨论决策,发现被错误答案混淆的"卧底"</span>
        </div>
        <div class="nu-mode-card__check">✓</div>
      </div>
      <div class="nu-mode-card">
        <div class="nu-mode-card__icon icon-tile icon-tile--app icon-tile--coral"><div class="icon-tile__glyph"></div></div>
        <div class="nu-mode-card__body">
          <span class="nu-mode-card__label">词语卧底</span>
          <span class="nu-mode-card__desc">经典玩法,描述自己的词,不能直接说出来</span>
        </div>
      </div>
    </div>

    <!-- 难度选择 -->
    <div class="nu-section-eyebrow">第二步 · 选个难度</div>
    <div class="nu-difficulty-row">
      <div class="nu-difficulty-chip">
        <div class="nu-difficulty-chip__dot nu-difficulty-chip__dot--student"></div>
        <span class="nu-difficulty-chip__label">护理学生</span>
      </div>
      <div class="nu-difficulty-chip nu-difficulty-chip--active">
        <div class="nu-difficulty-chip__dot nu-difficulty-chip__dot--new_nurse"></div>
        <span class="nu-difficulty-chip__label">新护士规培</span>
      </div>
      <div class="nu-difficulty-chip">
        <div class="nu-difficulty-chip__dot nu-difficulty-chip__dot--specialist"></div>
        <span class="nu-difficulty-chip__label">专科护士</span>
      </div>
    </div>

    <!-- 参数卡 -->
    <div class="nu-section-eyebrow">第三步 · 调个规模</div>
    <div class="nu-params-card card">
      <div class="nu-param">
        <div class="nu-param__row">
          <span class="nu-param__label">AI 对手</span>
          <span class="nu-param__value">5 人</span>
        </div>
        <input type="range" min="4" max="6" value="5" class="nu-param__slider">
      </div>
      <div class="care-divider"></div>
      <div class="nu-param">
        <div class="nu-param__row">
          <span class="nu-param__label">发言轮数</span>
          <span class="nu-param__value">3 轮</span>
        </div>
        <input type="range" min="2" max="3" value="3" class="nu-param__slider">
      </div>
    </div>

    <!-- 开始按钮 -->
    <div class="nu-action-area">
      <button class="nu-action-btn">开始对局</button>
    </div>

    <!-- 最近对局 -->
    <div class="nu-section-eyebrow">最近对局</div>
    <div class="nu-history-list">
      <div class="nu-history-item card">
        <div class="nu-history-item__top">
          <span class="nu-history-item__title">导管相关血流感染处理</span>
          <span class="status-tag status-tag--success">胜利</span>
        </div>
        <div class="nu-history-item__bottom">
          <span class="text-muted">病例推理卧底 · 新护士规培</span>
        </div>
      </div>
      <div class="nu-history-item card">
        <div class="nu-history-item__top">
          <span class="nu-history-item__title">术后早期下床活动</span>
          <span class="status-tag status-tag--warning">失败</span>
        </div>
        <div class="nu-history-item__bottom">
          <span class="text-muted">词语卧底 · 护理学生</span>
        </div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
