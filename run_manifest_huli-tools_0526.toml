# huli-tools 运行清单
# 本文件列出每个 phase 的静态 gate 和部署后验收命令。
# 命令必须能在项目根目录直接解析。

[project]
name = "huli-tools"
root = "."
env_id = "cloudbase-3gphz7fk0fe1b760"

[gate.static]
description = "每次提交前必须通过的静态检查"
commands = [
  "git status --short --branch",
  "node --test tests/*.test.js",
  "bash scripts/check-js.sh",
  "bash scripts/check-boundaries.sh",
  "bash scripts/check-admin-web-boundaries.sh",
  "git diff --check",
]

[gate.deploy]
description = "云函数部署后人工/半自动验收步骤"
steps = [
  "1. 在微信开发者工具或 CloudBase CLI 中部署所有 cloudfunctions（含 coreModel、app_ai_draw、app_nursing_undercover、app_maic_worker、app_maic、app_maic_reconcile）",
  "2. 创建数据库集合（见 docs/cloud_collections.md，含 7 个 app_maic_* 私有集合与 model_providers、app_model_bindings）",
  "3. 配置云函数环境变量（见 docs/dev_setup.md）",
  "4. 调用 adminCore.initSchema 写入 seed 数据",
]

[phase.1]
description = "工程底座、集合契约、用户 bootstrap、应用目录 seed"
actions = ["创建/更新云函数 coreUser、adminCore", "创建 docs/cloud_collections.md"]

[phase.2]
description = "共享积分账本、冻结/结算/释放、示例工具扣费链路"
actions = ["创建/更新云函数 corePoints、coreApp、demoSum", "验证积分冻结->结算/释放链路"]

[phase.3]
description = "固定充值包、支付订单、mock 支付到账、真实支付预留"
actions = ["创建/更新云函数 corePayment", "验证 mock 支付到账"]

[phase.4]
description = "首页/我的/充值/订单/流水/示例工具前端体验"
actions = ["创建前端页面和 tabbar", "验证页面跳转和数据展示"]

[phase.5]
description = "管理员接口、审计、安全加固、集成测试和交接文档"
actions = [
  "完善 adminCore：upsertApp、upsertPackage、listAuditLogs",
  "加固 corePoints 内部接口 _internalToken",
  "更新测试文档和运行清单",
  "创建 docs/admin_operations.md 和 AGENTS.md",
]

[phase.6]
description = "应用接入边界治理与底座升级机制"
actions = [
  "创建 docs/app_boundary_and_onboarding.md 三层边界文档",
  "创建 templates/app_vertical_slice/ 新应用竖切模板",
  "创建 docs/templates/core_change_rfc.md 公共底座变更 RFC 模板",
  "创建 scripts/check-boundaries.sh 边界检查脚本",
  "更新 AGENTS.md 加入边界治理规则",
]

[phase.7]
description = "护士职业定妆照应用与异步生图链路"
actions = [
  "将 app_ai_draw 云函数和 pages/apps/ai_draw 页面替换为护士职业定妆照",
  "创建 app_ai_draw_tasks 私有集合绑定 usageId/jobId/主体照/参考图",
  "验证护士定妆照成功结算、失败释放、超时取消和上传素材校验",
]

[phase.8]
description = "谁是卧底（护理版）教学游戏应用"
actions = [
  "新增 app_nursing_undercover 云函数和 pages/apps/nursing_undercover 页面",
  "创建 app_nursing_undercover_sessions 私有集合绑定 usageId/session/发言/投票/复盘",
  "验证词语卧底、病例推理、历史回看、取消释放和 AI fallback",
]

[phase.9]
description = "小程序虚拟支付接入与积分充值上线"
actions = [
  "corePayment 新增 createVirtualOrder/confirmVirtualOrder/getOrder 与 xpay_goods_deliver_notify 发货推送处理",
  "recharge_packages 增加 productId 字段（adminCore.upsertPackage 与 admin-web 充值包表单同步支持）",
  "充值页接入 wx.requestVirtualPayment（short_series_goods），mock 卡片仅 mockEnabled 时显示",
  "云开发消息推送配置 xpay_goods_deliver_notify -> corePayment",
  "验证沙箱下单->支付->查单/推送->积分到账->订单 paid 全链路",
]

[phase.10]
description = "界面整体重设计 v4.1（清透活力 · Bento 工具墙）"
actions = [
  "设计系统 v3->v4.1：品牌紫 #7C5CFC，docs/design_system.md 重写",
  "首页重构为 Bento 磁贴工具墙，积分后置为顶栏胶囊，删除 quick-nav",
  "我的页改为账户中心（紫色 hero + 菜单卡），tabbar 改为 工具/我的",
  "tokens.wxss/common.wxss 全量替换，ui 组件与六个核心页面迁移，应用执行页换壳",
  "admin-web theme.ts token 对齐（主色活力紫、侧栏深紫灰）",
]

[phase.10]
description = "MAIC 智慧课堂原生小程序应用"
actions = [
  "新增 app_maic 队列 API、app_maic_worker 单并发生成器与 app_maic_reconcile 收口链路",
  "创建 7 个 app_maic_* 私有集合并设置私有权限和查询索引",
  "新增课程列表、创建、进度、详情和原生播放器页面",
  "验证 usageId 幂等、M2.7、协议纠错与兜底、四类场景、忽略旧 navigate、互动门控和失败结算",
]

[phase.11]
description = "大模型网关 coreModel 与模型注册表/绑定集合"
actions = [
  "新增 coreModel 云函数（generateText/smokeProvider/seedDefaults 内部 action，drivers/minimax.js 与 drivers/cloudbaseAi.js）",
  "创建 model_providers、app_model_bindings 公共集合（客户端无权限，密钥仅存 secretEnv 环境变量名）",
  "adminCore 新增 listModelProviders/upsertModelProvider/listModelBindings/upsertModelBinding/smokeModelProvider",
  "app_maic_worker、app_nursing_undercover 模型调用改经 coreModel.generateText",
  "新增 tests/core-model-router.test.js 单测，check-boundaries.sh 敏感集合与禁止引用列表加入 model_providers/app_model_bindings",
]

[phase.12]
description = "护理论文英文润色应用（paper_polish，包装 nature-polishing 技能）"
actions = [
  "新增 app_paper_polish 云函数（submit/runTask/query/latest，异步任务模式，coreModel capability=polish，0 积分）",
  "prompts/ 蒸馏 nature-polishing 技能（Apache-2.0，commit 1562ab71）为 core/language/sections 模块并新增护理领域附录",
  "创建 app_paper_polish_tasks 私有集合（客户端无权限），cloudbaserc.json 与 adminCore 集合清单同步登记",
  "新增 pages/apps/paper_polish 执行页（粘贴文本、章节多选、3s 轮询、成稿复制），首页磁贴新增 tile--paper-polish 亮蓝主题",
  "新增 tests/paper-polish-core.test.js 单测（语言检测、章节归一化、prompt 组装、输出解析）",
]

[env.required]
description = "云函数环境变量（开发阶段最小集）"
vars = [
  { name = "ADMIN_OPENIDS", example = "openid1,openid2", note = "管理员白名单，逗号分隔" },
  { name = "PAYMENT_PROVIDER", example = "mock", note = "mock / virtual / wechat（预留）" },
  { name = "MOCK_PAYMENT_ENABLED", example = "true", note = "开发测试用，生产必须 false" },
  { name = "INTERNAL_API_SECRET", example = "随机字符串", note = "云函数间调用凭据，必须显式配置且所有公共云函数保持一致" },
  { name = "CLOUDBASE_AI_MODEL", example = "按 DescribeAIModels 启用结果填写", note = "仅 coreModel 使用，作 seedDefaults 种子来源；绑定缺失时应用走模板 fallback" },
  { name = "CLOUDBASE_AI_ENV_ID", example = "cloudbase-3gphz7fk0fe1b760", note = "可选，CloudBase AI SDK 初始化环境" },
  { name = "MAIC_AI_MODE", example = "direct_minimax", note = "当前环境固定使用 Worker 服务端直连" },
  { name = "MAIC_AI_MODEL", example = "MiniMax-M2.7", note = "仅 coreModel 使用，作 seedDefaults 种子来源" },
  { name = "MINIMAX_BASE_URL", example = "https://api.minimaxi.com/v1", note = "仅 coreModel 使用" },
  { name = "MINIMAX_API_KEY", example = "仅云函数环境变量", note = "仅 coreModel 使用，禁止写入仓库和日志" },
  { name = "MAIC_DAILY_LIMIT", example = "3", note = "仅 app_maic 使用，最大为3" },
]

[env.virtual_payment]
description = "小程序虚拟支付环境变量（仅当 PAYMENT_PROVIDER=virtual 时需要）"
vars = [
  "VIRTUAL_PAY_OFFER_ID",
  "VIRTUAL_PAY_APP_KEY",
  "VIRTUAL_PAY_APP_KEY_SANDBOX",
  "VIRTUAL_PAY_ENV",
  "WX_MINIPROGRAM_APPSECRET",
]

[env.wechat_payment]
description = "真实微信支付环境变量（仅当 PAYMENT_PROVIDER=wechat 时需要）"
vars = [
  "WX_PAY_MCH_ID",
  "WX_PAY_APPID",
  "WX_PAY_API_V3_KEY",
  "WX_PAY_SERIAL_NO",
  "WX_PAY_PRIVATE_KEY",
  "WX_PAY_NOTIFY_URL",
]
