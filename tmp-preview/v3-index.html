<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首页 v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
:root {
  --color-bg: #F5F0E8;
  --color-surface: #FBF8F2;
  --color-bg-card: #ffffff;
  --color-border: #E0D6C2;
  --color-border-soft: #EDE5D3;
  --color-primary: #8A6A3A;
  --color-primary-light: #F2E9D8;
  --color-on-primary: #ffffff;
  --color-brand-soft: #7A8B6A;
  --color-accent-warm: #C8804A;
  --color-accent-warm-light: #F4E2D2;
  --color-text: #2D2418;
  --color-text-secondary: #5A4A38;
  --color-text-muted: #8A7A66;
  --radius-sm: 4px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-pill: 999px;
  --gradient-primary: linear-gradient(135deg, #8A6A3A 0%, #B8956A 100%);
  --gradient-hero: linear-gradient(135deg, #B8956A 0%, #98A888 100%);
  --gradient-warm: linear-gradient(135deg, #C8804A 0%, #D69A6A 100%);
  --gradient-brand-soft: linear-gradient(135deg, #7A8B6A 0%, #98A888 100%);
  --gradient-peach: linear-gradient(135deg, #C8988A 0%, #D6A8A0 100%);
  --gradient-lavender: linear-gradient(135deg, #9A8AA8 0%, #B0A0BC 100%);
  --page-bg: linear-gradient(180deg, #EFE6D2 0%, #F5F0E8 160px, #F8F4EB 100%);
  --font-serif: "Noto Serif SC", "Songti SC", Georgia, serif;
  --font-sans: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
  --shadow-soft: 0 1px 2px rgba(45,36,24,0.04), 0 2px 8px rgba(45,36,24,0.04);
  --shadow-card: 0 1px 1px rgba(255,255,255,0.5) inset, 0 2px 12px rgba(125,98,50,0.08);
  --shadow-elevated: 0 1px 1px rgba(255,255,255,0.6) inset, 0 8px 24px rgba(125,98,50,0.1);
}
html, body { margin: 0; }
body { font-family: var(--font-sans); background: #555; color: var(--color-text); -webkit-font-smoothing: antialiased; }
.page-frame { width: 390px; height: 844px; overflow: hidden; background: var(--page-bg); position: relative; margin: 24px auto; box-shadow: 0 12px 60px rgba(0,0,0,0.3); }
.status-bar { position: absolute; top: 0; left: 0; right: 0; height: 44px; background: #F5F0E8; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 15px; font-weight: 600; color: #2D2418; z-index: 10; }
.status-bar__time { font-variant-numeric: tabular-nums; }
.status-bar__icons { display: flex; gap: 6px; align-items: center; }
.status-bar__icons::after { content: ''; display: inline-block; width: 24px; height: 12px; background: #2D2418; border-radius: 3px; }
.nav-bar { position: absolute; top: 44px; left: 0; right: 0; height: 44px; background: #F5F0E8; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; color: #2D2418; z-index: 10; border-bottom: 0.5px solid rgba(0,0,0,0.05); }
.scroll-content { position: absolute; top: 88px; left: 0; right: 0; bottom: 0; overflow-y: auto; padding: 16px; padding-bottom: 32px; }
.serif-num { font-family: var(--font-serif); font-variant-numeric: tabular-nums; font-weight: 600; }

/* icon-tile */
.icon-tile { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; flex-shrink: 0; box-shadow: var(--shadow-soft); --icon-line: #fff; }
.icon-tile--app { width: 44px; height: 44px; border-radius: 12px; }
.icon-tile--sm { width: 24px; height: 24px; border-radius: 6px; }
.icon-tile--coral { background: var(--gradient-warm); }
.icon-tile--lavender { background: var(--gradient-lavender); }
.icon-tile--teal { background: var(--gradient-brand-soft); }
.icon-tile--peach { background: var(--gradient-peach); }

.icon-tile--recharge::before { content: ''; position: absolute; left: 10px; top: 12px; width: 21px; height: 15px; border: 2.5px solid #fff; border-radius: 4.5px; }
.icon-tile--recharge::after { content: ''; position: absolute; right: 9px; top: 16px; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
.icon-tile--orders::before { content: ''; position: absolute; left: 11.5px; top: 8px; width: 17px; height: 24px; border-radius: 4px; background: #fff; }
.icon-tile--orders::after { content: ''; position: absolute; left: 15.5px; top: 14.5px; width: 9px; height: 2px; border-radius: 999px; background: rgba(45,36,24,0.32); box-shadow: 0 5px 0 rgba(45,36,24,0.28), 0 10px 0 rgba(45,36,24,0.22); }
.icon-tile--transactions::before { content: ''; position: absolute; left: 9px; top: 12px; width: 22px; height: 14px; border-left: 2.5px solid #fff; border-bottom: 2.5px solid #fff; border-radius: 0 0 0 8px; }
.icon-tile--transactions::after { content: ''; position: absolute; right: 7.5px; top: 9px; width: 8px; height: 8px; border-top: 2.5px solid #fff; border-right: 2.5px solid #fff; transform: rotate(45deg); }
.icon-tile--records::before { content: ''; position: absolute; left: 11.5px; top: 8.5px; width: 17px; height: 23px; border: 2.5px solid #fff; border-radius: 4px; }
.icon-tile--records::after { content: ''; position: absolute; left: 15.5px; top: 6px; width: 9px; height: 5px; border-radius: 3px; background: #fff; box-shadow: 0 15px 0 -1.5px #fff, 0 21px 0 -1.5px #fff; }

.phase-switcher { position: fixed; top: 12px; left: 12px; z-index: 100; background: rgba(0,0,0,0.7); border-radius: 6px; padding: 4px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 360px; }
.phase-switcher button { background: transparent; border: none; color: #fff; padding: 6px 10px; font-size: 11px; border-radius: 4px; cursor: pointer; font-weight: 500; }
.phase-switcher button.active { background: #8A6A3A; }
</style>
</head>
<body>

<div class="phase-switcher">
  <button onclick="location.href='v3-p0-config.html'">P0</button>
  <button class="active" onclick="location.href='v3-index.html'">首页</button>
  <button onclick="location.href='v3-profile.html'">我的</button>
  <button onclick="location.href='v3-orders.html'">订单</button>
  <button onclick="location.href='v3-recharge.html'">充值</button>
  <button onclick="location.href='v3-undercover-game.html'">卧底中</button>
  <button onclick="location.href='v3-undercover-result.html'">卧底结果</button>
</div>

<div class="page-frame">
  <div class="status-bar"><span class="status-bar__time">9:41</span><span class="status-bar__icons"></span></div>
  <div class="nav-bar">huli-tools</div>

  <div class="scroll-content">
    <!-- 积分 hero -->
    <div style="position: relative; overflow: hidden; border-radius: 24px; padding: 16px; margin-bottom: 16px; background: var(--gradient-hero); box-shadow: var(--shadow-elevated);">
      <div style="position: absolute; top: -20px; right: -20px; width: 100px; height: 100px; border-radius: 50%; background: rgba(255,255,255,0.10);"></div>
      <div style="display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1;">
        <div style="display: flex; flex-direction: column;">
          <span class="serif-num" style="font-size: 12px; color: #fff; opacity: 0.85; margin-bottom: 3px;">可用积分</span>
          <span class="serif-num" style="font-size: 32px; font-weight: 600; color: #fff; line-height: 1.1;">2,840</span>
        </div>
        <div style="background: rgba(255,255,255,0.22); border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; padding: 7px 16px;">
          <span style="font-size: 13px; color: #fff; font-weight: 600;">充值</span>
        </div>
      </div>
    </div>

    <!-- 快捷入口 -->
    <div style="display: flex; justify-content: space-between; margin-bottom: 20px; padding: 0 4px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 56px; padding: 3px 6px; border-radius: 10px;">
        <div class="icon-tile icon-tile--coral icon-tile--recharge" style="width: 42px; height: 42px;">
          <div style="position: absolute; left: 10.5px; top: 12.5px; width: 21px; height: 15px; border: 2.5px solid #fff; border-radius: 4.5px;"></div>
          <div style="position: absolute; right: 9.5px; top: 16.5px; width: 8px; height: 8px; border-radius: 50%; background: #fff;"></div>
        </div>
        <span style="font-size: 12px; color: var(--color-text-secondary); font-weight: 500;">充值</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 56px; padding: 3px 6px; border-radius: 10px;">
        <div class="icon-tile icon-tile--lavender" style="width: 42px; height: 42px;">
          <div style="position: absolute; left: 12.5px; top: 9px; width: 17px; height: 24px; border-radius: 4px; background: #fff;"></div>
          <div style="position: absolute; left: 16.5px; top: 15.5px; width: 9px; height: 2px; border-radius: 999px; background: rgba(45,36,24,0.32); box-shadow: 0 5px 0 rgba(45,36,24,0.28), 0 10px 0 rgba(45,36,24,0.22);"></div>
        </div>
        <span style="font-size: 12px; color: var(--color-text-secondary); font-weight: 500;">订单</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 56px; padding: 3px 6px; border-radius: 10px;">
        <div class="icon-tile icon-tile--teal" style="width: 42px; height: 42px;">
          <div style="position: absolute; left: 10px; top: 13px; width: 22px; height: 14px; border-left: 2.5px solid #fff; border-bottom: 2.5px solid #fff; border-radius: 0 0 0 8px;"></div>
          <div style="position: absolute; right: 8.5px; top: 10px; width: 8px; height: 8px; border-top: 2.5px solid #fff; border-right: 2.5px solid #fff; transform: rotate(45deg);"></div>
        </div>
        <span style="font-size: 12px; color: var(--color-text-secondary); font-weight: 500;">流水</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 56px; padding: 3px 6px; border-radius: 10px;">
        <div class="icon-tile icon-tile--peach" style="width: 42px; height: 42px;">
          <div style="position: absolute; left: 12.5px; top: 9.5px; width: 17px; height: 23px; border: 2.5px solid #fff; border-radius: 4px;"></div>
          <div style="position: absolute; left: 16.5px; top: 7px; width: 9px; height: 5px; border-radius: 3px; background: #fff; box-shadow: 0 15px 0 -1.5px #fff, 0 21px 0 -1.5px #fff;"></div>
        </div>
        <span style="font-size: 12px; color: var(--color-text-secondary); font-weight: 500;">记录</span>
      </div>
    </div>

    <!-- section title -->
    <div style="display: block; font-size: 15px; font-weight: 600; color: var(--color-text); line-height: 1.35; margin: 2px 0 11px; padding-left: 13px; position: relative;">
      <span style="position: absolute; left: 0; top: 4px; bottom: 4px; width: 4px; border-radius: 999px; background: var(--color-accent-warm);"></span>
      应用目录
    </div>

    <!-- 应用卡 -->
    <div style="background: #fff; border-radius: 16px; padding: 14px 13px; margin-bottom: 10px; box-shadow: var(--shadow-card); border: 0.5px solid var(--color-border-soft); display: flex; align-items: center;">
      <div class="icon-tile icon-tile--app icon-tile--lavender icon-tile--calculator" style="margin-right: 12px;">
        <div style="position: absolute; left: 11px; top: 8px; width: 20px; height: 26px; border: 2.5px solid #fff; border-radius: 5px;"></div>
        <div style="position: absolute; left: 15px; top: 13px; width: 11px; height: 3.5px; border-radius: 2px; background: #fff; box-shadow: 0 8.5px 0 -0.5px #fff, 0 15px 0 -0.5px #fff;"></div>
      </div>
      <div style="flex: 1; min-width: 0;">
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 3px;">
          <span class="serif-num" style="font-size: 16px; font-weight: 600; color: var(--color-text); line-height: 1.25;">积分示例工具</span>
        </div>
        <div style="font-size: 12.5px; color: var(--color-text-secondary); line-height: 1.45; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">输入两个数字求和，演示积分扣费链路</div>
        <div style="display: flex; align-self: flex-start; align-items: center; justify-content: center; min-height: 22px; background: var(--color-accent-warm-light); border-radius: 999px; padding: 0 9px; margin-top: 5px;">
          <span class="serif-num" style="font-size: 11.5px; color: var(--color-accent-warm); font-weight: 600; line-height: 1;">1 积分/次</span>
        </div>
      </div>
      <div style="width: 22px; height: 22px; margin-left: 8px; border-radius: 50%; background: var(--color-surface); border: 0.5px solid var(--color-border-soft); display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0;">
        <div style="position: absolute; left: 7px; top: 6px; width: 6px; height: 6px; border-top: 2px solid var(--color-primary); border-right: 2px solid var(--color-primary); transform: rotate(45deg);"></div>
      </div>
    </div>

    <div style="background: #fff; border-radius: 16px; padding: 14px 13px; margin-bottom: 10px; box-shadow: var(--shadow-card); border: 0.5px solid var(--color-border-soft); display: flex; align-items: center;">
      <div class="icon-tile icon-tile--app icon-tile--peach" style="margin-right: 12px;">
        <div style="position: absolute; left: 9.5px; top: 10px; width: 23px; height: 21px; border: 2.5px solid #fff; border-radius: 5px;"></div>
        <div style="position: absolute; left: 14px; top: 22px; width: 15px; height: 9px; background: #fff; clip-path: polygon(0 100%, 38% 26%, 58% 58%, 74% 36%, 100% 100%);"></div>
        <div style="position: absolute; right: 12px; top: 14px; width: 5px; height: 5px; border-radius: 50%; background: #fff;"></div>
      </div>
      <div style="flex: 1; min-width: 0;">
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 3px;">
          <span class="serif-num" style="font-size: 16px; font-weight: 600; color: var(--color-text); line-height: 1.25;">护士职业定妆照</span>
        </div>
        <div style="font-size: 12.5px; color: var(--color-text-secondary); line-height: 1.45; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">上传本人形象照和参考图，生成护士职业标准照</div>
        <div style="display: flex; align-self: flex-start; align-items: center; justify-content: center; min-height: 22px; background: var(--color-accent-warm-light); border-radius: 999px; padding: 0 9px; margin-top: 5px;">
          <span class="serif-num" style="font-size: 11.5px; color: var(--color-accent-warm); font-weight: 600; line-height: 1;">0 积分/次</span>
        </div>
      </div>
      <div style="width: 22px; height: 22px; margin-left: 8px; border-radius: 50%; background: var(--color-surface); border: 0.5px solid var(--color-border-soft); display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0;">
        <div style="position: absolute; left: 7px; top: 6px; width: 6px; height: 6px; border-top: 2px solid var(--color-primary); border-right: 2px solid var(--color-primary); transform: rotate(45deg);"></div>
      </div>
    </div>

    <div style="background: #fff; border-radius: 16px; padding: 14px 13px; margin-bottom: 10px; box-shadow: var(--shadow-card); border: 0.5px solid var(--color-border-soft); display: flex; align-items: center;">
      <div class="icon-tile icon-tile--app icon-tile--lavender" style="margin-right: 12px;">
        <div style="position: absolute; left: 10px; top: 9px; width: 18px; height: 18px; border: 2.5px solid #fff; border-radius: 50%;"></div>
        <div style="position: absolute; left: 25px; top: 25px; width: 9px; height: 2.5px; background: #fff; border-radius: 999px; transform: rotate(45deg);"></div>
        <div style="position: absolute; left: 16px; top: 12.5px; width: 4px; height: 7px; border-top: 2.5px solid #fff; border-right: 2.5px solid #fff; border-radius: 0 4px 0 0;"></div>
        <div style="position: absolute; left: 17px; top: 21.5px; width: 2.5px; height: 2.5px; border-radius: 50%; background: #fff;"></div>
      </div>
      <div style="flex: 1; min-width: 0;">
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 3px;">
          <span class="serif-num" style="font-size: 16px; font-weight: 600; color: var(--color-text); line-height: 1.25;">谁是卧底（护理版）</span>
        </div>
        <div style="font-size: 12.5px; color: var(--color-text-secondary); line-height: 1.45; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">AI NPC 参与的护理教学卧底推理游戏</div>
        <div style="display: flex; align-self: flex-start; align-items: center; justify-content: center; min-height: 22px; background: var(--color-accent-warm-light); border-radius: 999px; padding: 0 9px; margin-top: 5px;">
          <span class="serif-num" style="font-size: 11.5px; color: var(--color-accent-warm); font-weight: 600; line-height: 1;">0 积分/次</span>
        </div>
      </div>
      <div style="width: 22px; height: 22px; margin-left: 8px; border-radius: 50%; background: var(--color-surface); border: 0.5px solid var(--color-border-soft); display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0;">

      </div>
    </div>
  </div>
</div>

</body>
</html>
